[project]
name = "musubi-sdk"
version = "0.1.0"
description = "Small Python client for the Musubi HTTP API"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Eric Mey"}]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/sourceblender/musubi-sdk"
Repository = "https://github.com/sourceblender/musubi-sdk"
Issues = "https://github.com/sourceblender/musubi-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musubi_sdk"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "opentelemetry-sdk>=1.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]
